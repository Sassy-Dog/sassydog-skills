# TEMPLATE: lockfile-sync-pod · version 1
# Rendered by sassy-dog:refresh-deps for repos where
# detect-ecosystems.sh reports cocoapods with lockfile_risk (a tracked Podfile).
#   {{RUNNER}}           → runs-on; MUST be macOS (pod install). Default:
#                          [self-hosted, macOS, sassy-dog]
#   {{PUBSPEC_PATH}}     → path to the Flutter pubspec.yaml that triggers this
#   {{IOS_DIR}}          → directory holding the Podfile
#   {{FLUTTER_VERSION}}  → keep in lockstep with the release workflow
# Delete this header block from the rendered output; keep the generated-by line.
---
# generated-by: sassy-dog:refresh-deps | template: lockfile-sync-pod | template-version: 1
#
# Refresh pubspec.lock + Podfile.lock on Dependabot pub PRs — the macOS twin of
# dependabot-bun-lockfile.yml.
#
# THE PROBLEM: Dependabot updates pubspec.yaml but cannot run `pod install`, so
# any CI step verifying the pods are in sync correctly fails the PR. Dependabot
# has no cocoapods ecosystem at all, so this cannot be fixed by configuration —
# only by regenerating the lockfiles out of band, which is what this does.
#
# Same posture as the bun twin, for the same reasons:
#   - pull_request_target for write context; job HARD-GATED to dependabot[bot],
#     so contributor PR code never reaches a write-capable context.
#   - Push with a minted App token, not GITHUB_TOKEN: the push must re-trigger
#     CI and must not trip the bot-actor approval gate.
#   - Clean regeneration rather than chasing per-pod constraint prompts.
#   - PR head ref/repo via env:, never inlined into a run: shell.
#
# Security note: `pod install` evaluates podspec Ruby from the resolved pod set.
# These are the same podspecs the release iOS build already executes on this
# runner for any merged bump, so the dependabot[bot] gate keeps the risk delta
# at zero — but do NOT widen the actor gate.

name: Dependabot pod lockfile sync

on:
  pull_request_target:
    paths:
      - '{{PUBSPEC_PATH}}'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '{{FLUTTER_VERSION}}'

jobs:
  update-pod-lock:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: {{RUNNER}}
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PLATFORM_WRITER_APP_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PR_HEAD_REF }}
          repository: ${{ env.PR_HEAD_REPO }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Regenerate pubspec.lock first: `pod install` resolves against the
      # Flutter plugin set, so a stale pubspec.lock yields a stale Podfile.lock.
      - name: Regenerate pubspec.lock
        run: flutter pub get

      # Full clean regeneration. A partial `pod update <name>` chases per-pod
      # constraint prompts and can leave the lock internally inconsistent.
      - name: Regenerate Podfile.lock
        working-directory: '{{IOS_DIR}}'
        run: |
          rm -f Podfile.lock
          pod install --repo-update

      - name: Commit and push lockfiles if changed
        run: |
          if git diff --quiet -- '*.lock' 'Podfile.lock' '{{IOS_DIR}}/Podfile.lock'; then
            echo "lockfiles unchanged after regeneration — nothing to commit."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add -- '*.lock' '{{IOS_DIR}}/Podfile.lock'
          git commit -m "chore(deps): regenerate pubspec.lock + Podfile.lock for Dependabot pub bump"
          git push origin "HEAD:${PR_HEAD_REF}"
