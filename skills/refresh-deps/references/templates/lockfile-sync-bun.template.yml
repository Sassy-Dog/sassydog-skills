# TEMPLATE: lockfile-sync-bun · version 2
# Rendered by sassy-dog:refresh-deps for repos where
# detect-ecosystems.sh reports npm with lockfile_risk (a tracked bun.lock).
#   {{RUNNER}}  → runs-on value (default: [self-hosted, linux, sassy-dog])
# Delete this header block from the rendered output; keep the generated-by line.
---
# generated-by: sassy-dog:refresh-deps | template: lockfile-sync-bun | template-version: 2
#
# Refresh bun.lock on Dependabot npm PRs.
#
# THE PROBLEM THIS SOLVES: Dependabot updates package.json but cannot write
# bun.lock (a Bun-specific format). CI then runs `bun install --frozen-lockfile`
# and rejects the PR. Without this workflow, every npm PR in a Bun repo is dead
# on arrival — qr-ninja merged 0 of 20 before deleting the ecosystem outright.
# Security updates cannot be opted out of that way, so the fix has to be here.
#
# Why pull_request_target: Dependabot's GITHUB_TOKEN is read-only by design.
# Pushing the lockfile commit needs write, which only the BASE repo context
# grants. That makes the actor gate below load-bearing, not decorative.
#
# Why an App token rather than GITHUB_TOKEN for the push: a GITHUB_TOKEN push
# lands as github-actions[bot], which (a) does not re-trigger CI on the new
# commit and (b) trips the bot-actor "awaiting approval" gate on any run that
# does appear. The App push re-fires CI normally with no approval step.
#
# Security posture — do not weaken any of these:
#   1. Hard-gated to dependabot[bot], so contributor PR code never reaches a
#      write-capable context.
#   2. `--ignore-scripts` blocks lifecycle scripts (preinstall/postinstall/
#      prepare) during install. Lockfile content does not depend on their
#      output, so the result is functionally identical to a normal install.
#   3. permissions: contents: write only — the push is the sole privileged op.
#   4. PR head ref/repo funnelled through env:, never inlined into a run:
#      shell. Inlining is the classic Actions script-injection vector.

name: Dependabot bun.lock sync

on:
  pull_request_target:
    paths:
      - '**/package.json'

permissions:
  contents: write

jobs:
  update-bun-lock:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: {{RUNNER}}
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PLATFORM_WRITER_APP_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PR_HEAD_REF }}
          repository: ${{ env.PR_HEAD_REPO }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Restore the BASE branch's bun.lock, then loose-install. Discarding the
      # PR's lockfile edit matters because a loose `bun install` considers
      # Dependabot's npm-style edit valid and writes nothing — while strict
      # `--frozen-lockfile` in CI still rejects it. Against the pristine base
      # lock, the bumped package.json range genuinely no longer resolves, so
      # Bun re-resolves ONLY that subtree and writes it back strict-valid.
      #
      # v1 deleted bun.lock and regenerated from scratch. That floated every
      # semver range in the workspace: a one-package mobile bump carried a
      # 2,486-line lock diff (qr-ninja#748 — @base-ui/react 1.2→1.6 among
      # ~40 unrelated floats), one of which broke web's type check on every
      # npm PR. Wholesale regeneration also destroys per-package attribution
      # and smuggles an unreviewed all-deps upgrade into an auto-mergeable
      # bump PR — minimal churn is a supply-chain property, not cosmetics.
      - name: Update bun.lock for the bumped packages only
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_REF"
          git checkout FETCH_HEAD -- bun.lock
          bun install --ignore-scripts

      # Fail-closed assertion (never trust a green that checked nothing): the
      # rewritten lock must satisfy the same strict install CI runs. If the
      # minimal update could not produce a frozen-valid lock, fail HERE with
      # the real error rather than shipping a commit that reddens CI.
      - name: Assert the lock is frozen-valid
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Commit and push bun.lock if changed
        run: |
          if git diff --quiet bun.lock; then
            echo "bun.lock unchanged after regeneration — nothing to commit."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): regenerate bun.lock for Dependabot npm bump"
          git push origin "HEAD:${PR_HEAD_REF}"
