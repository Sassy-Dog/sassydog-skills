# TEMPLATE: lockfile-sync-pod · version 6
# Rendered by sassy-dog:setup-deps for repos where
# detect-ecosystems.sh reports cocoapods with lockfile_risk (a tracked Podfile).
#
# PRECONDITION — check before rendering: '{{APP_DIR}}/ios/Podfile.lock' must
# itself be TRACKED (`git ls-files` lists it). A tracked Podfile is not enough.
# In a repo that gitignores the lock (tailoredtip: release builds regenerate it
# every run, so it is a build artifact there, not a committed version pin)
# there is nothing to sync, and the rendered workflow hard-fails instead of
# no-op'ing: `flutter pub get` still changes the tracked pubspec.lock, so the
# changed-lockfiles guard falls through to `git add` on an explicitly-ignored
# path — exit 1 under bash -e, a red job holding the fleet's single macOS
# runner on every pub PR (tailoredtip#252). Gitignored Podfile.lock → do NOT
# render; record why the pod workflow was skipped.
#
#   {{RUNNER}}           → runs-on; MUST be macOS (pod install). Default:
#                          [self-hosted, macOS, sassy-dog]
#   {{APP_DIR}}          → Flutter app directory relative to the repo root, no
#                          leading ./ and no trailing / (tailoredtip: app ·
#                          velovate: apps/mobile · root-level app: .).
#                          Replaces v1's {{PUBSPEC_PATH}} and {{IOS_DIR}} —
#                          every pubspec/Podfile path below derives from this
#                          one fact, so the paths can never disagree.
#                          Nested app: substitute {{APP_DIR}} literally and
#                          delete only the # {{IF:NESTED_APP}} marker lines.
#                          Root app (.): delete each # {{IF:NESTED_APP}} block
#                          wholesale and collapse every '{{APP_DIR}}/' to '' —
#                          a ./ prefix breaks the on.paths filter, and the
#                          collapse keeps root renders byte-identical to v1's.
#   {{FLUTTER_VERSION}}  → keep in lockstep with the release workflow
# Delete this header block from the rendered output; keep the generated-by line.
---
# generated-by: sassy-dog:setup-deps | template: lockfile-sync-pod | template-version: 6
#
# Refresh pubspec.lock + Podfile.lock on Dependabot pub PRs — the macOS twin of
# dependabot-bun-lockfile.yml.
#
# THE PROBLEM: Dependabot updates pubspec.yaml but cannot run `pod install`, so
# any CI step verifying the pods are in sync correctly fails the PR. Dependabot
# has no cocoapods ecosystem at all, so this cannot be fixed by configuration —
# only by regenerating the lockfiles out of band, which is what this does.
#
# Same posture as the bun twin, for the same reasons:
#   - pull_request_target for write context; job HARD-GATED to dependabot[bot],
#     so contributor PR code never reaches a write-capable context.
#   - Push with a minted App token, not GITHUB_TOKEN: the push must re-trigger
#     CI and must not trip the bot-actor approval gate.
#   - Clean regeneration rather than chasing per-pod constraint prompts.
#   - PR head ref/repo via env:, never inlined into a run: shell.
#   - The App token never reaches .git/config: checkout sets
#     persist-credentials: false and passes no token: at all, and only the push
#     step carries the credential, inline from its own env: (issue #232).
#
# Security note: `pod install` evaluates podspec Ruby from the resolved pod set.
# These are the same podspecs the release iOS build already executes on this
# runner for any merged bump, so the dependabot[bot] gate keeps the risk delta
# at zero — but do NOT widen the actor gate.

name: Dependabot pod lockfile sync

on:
  pull_request_target:
    paths:
      - '{{APP_DIR}}/pubspec.yaml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '{{FLUTTER_VERSION}}'

jobs:
  update-pod-lock:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: {{RUNNER}}
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint below fails as an opaque auth error that reads as
      # unrelated to its cause (issue #178). Name the cause here.
      #
      # Org secrets at `private` visibility cover private + internal repos and
      # EXCLUDE public ones, in the Actions and Dependabot stores alike. Since
      # #186 setup-deps refuses to render ANY of the three App-token workflows
      # into a public repo, so this guard is the backstop for the copies that
      # predate that rule or were hand-copied: it names the cause instead of
      # failing as an opaque auth error.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Dependabot secret(s):$missing — org secrets are private-visibility and do not reach public repositories (Sassy-Dog/sassydog-skills#178)."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      # No token: here, and persist-credentials: false. actions/checkout
      # defaults persist-credentials to true, which writes whatever token it
      # was given into .git/config for the rest of the job — in a workspace
      # that holds PR-authored content, and one where `pod install` then
      # evaluates podspec Ruby. The App token is needed only by the push, so it
      # is passed only there (issue #232). Dependabot pushes its head branch to
      # the BASE repo rather than a fork, so the default GITHUB_TOKEN reads
      # this ref fine; dropping token: costs nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_REF }}
          repository: ${{ env.PR_HEAD_REPO }}
          persist-credentials: false
          fetch-depth: 0

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Regenerate pubspec.lock first: `pod install` resolves against the
      # Flutter plugin set, so a stale pubspec.lock yields a stale Podfile.lock.
      - name: Regenerate pubspec.lock
        # {{IF:NESTED_APP}}
        working-directory: '{{APP_DIR}}'
        # {{ENDIF}}
        run: flutter pub get

      # Full clean regeneration. A partial `pod update <name>` chases per-pod
      # constraint prompts and can leave the lock internally inconsistent.
      - name: Regenerate Podfile.lock
        working-directory: '{{APP_DIR}}/ios'
        run: |
          rm -f Podfile.lock
          pod install --repo-update

      # The only step that needs repository write, and the only one holding
      # the credential. Pushing to an explicit authenticated URL rather than
      # to `origin` is what lets the checkout above stay credential-free.
      - name: Commit and push lockfiles if changed
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if git diff --quiet -- '*.lock' 'Podfile.lock' '{{APP_DIR}}/ios/Podfile.lock'; then
            echo "lockfiles unchanged after regeneration — nothing to commit."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add -- '*.lock' '{{APP_DIR}}/ios/Podfile.lock'
          git commit -m "chore(deps): regenerate pubspec.lock + Podfile.lock for Dependabot pub bump"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${PR_HEAD_REPO}.git" "HEAD:${PR_HEAD_REF}"
