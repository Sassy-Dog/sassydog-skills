name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # All gates live in scripts/preflight.sh (single source of truth for
      # version pins and guard regexes — run the same script locally before a
      # PR). It skips actionlint under CI=true; the dockerized step below owns
      # that gate here.
      - name: Preflight gates (shellcheck, frontmatter, guards, manifests, markdownlint)
        run: bash scripts/preflight.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
