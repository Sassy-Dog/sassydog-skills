name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ShellCheck (warning severity)
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck -S warning

      - name: Frontmatter sanity
        run: bash scripts/check-frontmatter.sh

      - name: Plugin manifests are valid JSON
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json > /dev/null

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - name: markdownlint
        run: npx -y markdownlint-cli2@0.18.1 "**/*.md"
