name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Required for the merge queue: without this the queue builds a merge_group
  # ref, no check ever reports against it, and entries sit until they time out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a merge_group run — cancelling one ejects the entry from
  # the queue. Only PR-branch runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, linux, sassy-dog]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The self-hosted image ships no shellcheck and runs as non-root `runner`
      # with no sudo, so it cannot be apt-installed at job time. The release
      # tarball unpacks into $HOME, which needs no privileges — the same reason
      # dtolnay/rust-toolchain works on this fleet. Keep the version in step
      # with the pin documented in scripts/preflight.sh.
      - name: Install shellcheck (absent from the self-hosted image)
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # All gates live in scripts/preflight.sh (single source of truth for
      # version pins and guard regexes — run the same script locally before a
      # PR). It skips actionlint under CI=true; the dockerized step below owns
      # that gate here.
      - name: Preflight gates (shellcheck, frontmatter, guards, manifests, markdownlint)
        run: bash scripts/preflight.sh

      # Native binary rather than the dockerized action. `docker` IS installed on
      # the self-hosted image, but its daemon cannot bind-mount the workspace —
      # `docker run -v "$PWD:/repo"` fails with
      #   mkdir /opt/actions-runner: permission denied
      # because the daemon is rootless and the runner is non-root. Presence of
      # docker does not imply usable volume mounts on this fleet; prefer a
      # released binary unpacked into $HOME, same as the shellcheck step above.
      - name: Install actionlint (docker bind-mounts unavailable on the fleet)
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          mkdir -p "$HOME/.local/bin"
          mv actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color
