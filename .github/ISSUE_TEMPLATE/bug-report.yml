name: Bug report
description: A skill or agent did the wrong thing, or did nothing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-relevant, use [private reporting](https://github.com/Sassy-Dog/sassydog-skills/security/advisories/new) instead of this form.

  - type: input
    id: skill
    attributes:
      label: Which skill or agent?
      description: The namespaced name, e.g. `sassy-dog:send-it` or `sassy-dog:security-reviewer`.
      placeholder: "sassy-dog:"
    validations:
      required: true

  - type: textarea
    id: invocation
    attributes:
      label: What did you say to trigger it?
      description: |
        Paste your exact wording. If the skill did **not** trigger at all, this is the single
        most useful field in the report — trigger phrases are matched against real utterances,
        so the precise phrasing is the bug.
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Relevant output, error text, or "nothing — it never activated".
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "`ls ~/.claude/plugins/cache/sassydog-skills/sassy-dog/` — highest number shown."
      placeholder: "2026.8.66"
    validations:
      required: false
