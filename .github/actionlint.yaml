# actionlint cannot know an org's self-hosted runner labels, so it flags every
# custom one as unknown. Declaring them here keeps the `runner-label` check
# useful — a genuine typo like `sassy-dgo` still fails — instead of forcing the
# whole check to be disabled.
#
# `self-hosted`, `linux`, `macos`, `x64` and `arm64` are built in; only the
# org-specific labels need listing.
#
# NOTE: no workflow in THIS repo may use any of them. sassydog-skills is public,
# `on: pull_request` fires for fork PRs, and an unguarded job on a self-hosted
# runner would let anyone execute code on the Sassy Dog fleet — see the standing
# comment on ci.yml's `runs-on`. These labels are declared only so this file
# stays identical to the org-wide actionlint config; treat any `runs-on` here
# that references one as a bug, not as guidance.
self-hosted-runner:
  labels:
    - sassy-dog
    - velovate
    - qr-ninja
